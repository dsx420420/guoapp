name: Build 全剧视界 TV 优化版 V2 32-bit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tv-optimized-v2-armv7.yml"
      - "scripts/tv_opt_v2.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  PYTHONUTF8: "1"

jobs:
  android-tv-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout build controls
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout upstream 1.0.5+79
        uses: actions/checkout@v4
        with:
          repository: mick303/guoapp2
          ref: 11e155b01d8c65c83626ee1793d68389b1a06090
          path: src

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/native/go.mod
          cache-dependency-path: src/native/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Apply TV V2 patch
        working-directory: src
        run: python ../control/scripts/tv_opt_v2.py .

      - name: Format patched Dart files
        working-directory: src
        run: dart format lib/remote_widgets.dart lib/widgets.dart lib/main.dart

      - name: Configure preview signing
        working-directory: src
        run: python scripts/configure_signing.py

      - name: Build all-sources TV V2 APK
        working-directory: src
        run: python scripts/build_android.py --all-sources --abi armeabi-v7a

      - name: Write build info
        working-directory: src
        shell: bash
        run: |
          {
            echo "Edition: 全剧视界 TV 优化版 V2"
            echo "Base: mick303/guoapp2 1.0.5+79"
            echo "ABI: armeabi-v7a"
            echo "Recommendation density: upstream default retained"
            echo "Performance: smaller TV cover decode, low filter quality, no full-card gradient, no focus animation"
            echo "Input: D-pad in-app keyboard plus native Android EditText Chinese input"
          } > dist/android/BUILD_INFO-TV-V2.txt

      - name: Upload TV V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: quanjushijie-1.0.5+79-tv-optimized-v2-armeabi-v7a
          path: |
            src/dist/android/*.apk
            src/dist/android/BUILD_INFO-TV-V2.txt
          if-no-files-found: error
          retention-days: 14
