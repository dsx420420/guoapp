name: Build ZhenGuoJian Windows x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  build:
    name: Build 真果鉴 Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout upstream guoapp source
        uses: actions/checkout@v4
        with:
          repository: zhoufuweigg/guoapp
          ref: main
          path: src

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/native/go.mod
          cache: true
          cache-dependency-path: src/native/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Install MinGW-w64
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          $candidates = @(
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\tools\mingw64\bin",
            "C:\mingw64\bin"
          )
          $found = $null
          foreach ($p in $candidates) {
            if (Test-Path (Join-Path $p "gcc.exe")) {
              $found = $p
              break
            }
          }
          if (-not $found) {
            $gcc = Get-ChildItem -Path C:\ -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "mingw" } |
              Select-Object -First 1
            if ($gcc) {
              $found = $gcc.Directory.FullName
            }
          }
          if (-not $found) {
            throw "MinGW gcc.exe was not found after installation."
          }
          Write-Host "Using MinGW: $found"
          $found | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain
        shell: pwsh
        run: |
          python --version
          go version
          flutter --version
          gcc --version
          flutter doctor -v

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Refresh Flutter lockfile
        shell: pwsh
        working-directory: src
        run: |
          flutter pub get
          git diff -- pubspec.lock

      - name: Build 真果鉴（全站源）
        shell: pwsh
        working-directory: src
        run: .\scripts\build_windows.ps1 -AllSources

      - name: Verify output
        shell: pwsh
        working-directory: src
        run: |
          if (-not (Test-Path "dist\windows")) {
            throw "dist\windows was not generated."
          }
          Get-ChildItem "dist\windows" -File | Format-Table Name, Length
          $zip = Get-ChildItem "dist\windows\zhenguojian-*-windows-x64.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "zhenguojian Windows x64 ZIP was not generated."
          }
          Write-Host "Package: $($zip.FullName)"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-windows-x64
          path: |
            src/dist/windows/zhenguojian-*-windows-x64.zip
            src/dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
